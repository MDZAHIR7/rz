<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<title>Invite links</title>

<link rel="apple-touch-icon" href="../app/img/apple-touch-icon.png">

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=EB+Garamond:ital,wght@0,400..600;1,400..500&family=Noto+Naskh+Arabic:wght@400;500&display=swap">
<style>
  :root {
    --marble: #FAF9F7;      /* page */
    --alabaster: #FFFEFC;   /* inside the arch, fields */
    --vein: #E7DFD4;        /* quiet hairlines */
    --edge: #9C8A78;        /* field borders, 3:1 on marble */
    --gold: #966120;        /* brand gold */
    --gold-ink: #7A4E1A;    /* gold for small text */
    --gold-wash: #F5EDE1;   /* chosen option */
    --ink: #2F2119;         /* espresso */
    --ink-2: #6A5546;       /* secondary text */

    --display: 'DM Serif Display', Georgia, 'Noto Naskh Arabic', serif;
    --text: 'EB Garamond', 'Garamond', 'Noto Naskh Arabic', Georgia, serif;
    --arabic: 'Noto Naskh Arabic', 'Geeza Pro', 'Segoe UI', serif;

    --gutter: 16px;
    --measure: 440px;
    --tap: 52px;
    --ease: cubic-bezier(.2, .7, .2, 1);
  }

  *, *::before, *::after { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; background: var(--marble); }
  body {
    margin: 0;
    background: var(--marble);
    color: var(--ink);
    font-family: var(--text);
    font-size: 19px;
    line-height: 1.5;
    font-variant-numeric: lining-nums;
    overflow-x: hidden;
    -webkit-font-smoothing: antialiased;
  }
  button, input, textarea { font: inherit; color: inherit; }
  ::selection { background: #EBD9BF; color: var(--ink); }

  .page {
    width: 100%;
    max-width: calc(var(--measure) + 2 * var(--gutter));
    margin: 0 auto;
    padding: calc(28px + env(safe-area-inset-top, 0px)) calc(var(--gutter) + env(safe-area-inset-right, 0px)) calc(56px + env(safe-area-inset-bottom, 0px)) calc(var(--gutter) + env(safe-area-inset-left, 0px));
  }

  /* ---------- header */
  .masthead { text-align: center; }
  .masthead h1 {
    margin: 0;
    font-family: var(--display);
    font-optical-sizing: auto;
    font-weight: 500;
    font-size: 34px;
    line-height: 1.1;
    letter-spacing: -0.005em;
  }
  .masthead p {
    margin: 8px auto 0;
    max-width: 30ch;
    color: var(--ink-2);
    font-size: 18px;
    line-height: 1.45;
  }

  /* ---------- the arch: a small copy of the invite's opening screen */
  .niche {
    position: relative;
    width: min(100%, 272px);
    min-height: 318px;
    margin: 26px auto 0;
    padding: 70px 30px 26px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-end;
    text-align: center;
    isolation: isolate;
  }
  .niche svg.frame {
    position: absolute; inset: 0; width: 100%; height: 100%;
    z-index: -1; overflow: visible;
  }
  .frame .body { fill: var(--alabaster); stroke: var(--gold); stroke-width: 1.25; }
  .frame .inlay { fill: none; stroke: var(--gold); stroke-width: .75; opacity: .55; }
  .bismillah {
    margin: 0 0 12px;
    font-family: var(--arabic);
    font-size: 17px;
    line-height: 1.9;
    color: var(--gold-ink);
    direction: rtl;
  }
  .bismillah[hidden] { display: none; }
  .niche .seal { width: 66px; height: auto; display: block; }
  .for-line {
    margin: 14px 0 0;
    font-family: var(--display);
    font-optical-sizing: auto;
    font-style: italic;
    font-weight: 400;
    font-size: 24px;
    line-height: 1.22;
    overflow-wrap: anywhere;
    max-width: 100%;
  }
  .for-line bdi { font-style: italic; }
  .for-line.is-empty .who { color: #A08D7D; }
  .niche .when {
    margin: 14px 0 0;
    padding-top: 10px;
    border-top: 1px solid var(--vein);
    font-size: 15.5px;
    line-height: 1.35;
    color: var(--ink-2);
    min-width: 11em;
  }

  /* ---------- form */
  form { margin: 26px 0 0; }
  .field + .field, .field + fieldset, fieldset + fieldset, fieldset + .field { margin-top: 30px; }
  .label, legend {
    display: block;
    padding: 0;
    margin: 0 0 8px;
    font-weight: 500;
    font-size: 20px;
    line-height: 1.3;
  }
  .hint { margin: -4px 0 10px; font-size: 16px; line-height: 1.4; color: var(--ink-2); }
  fieldset { border: 0; margin: 0; padding: 0; min-width: 0; }

  input[type="text"], textarea {
    display: block;
    width: 100%;
    min-height: var(--tap);
    padding: 12px 14px;
    background: var(--alabaster);
    border: 1px solid var(--edge);
    border-radius: 10px;
    font-size: 19px;
    line-height: 1.4;
    transition: border-color .15s var(--ease), box-shadow .15s var(--ease);
  }
  input[type="text"]::placeholder, textarea::placeholder { color: #9A8878; opacity: 1; }
  input[type="text"]:hover, textarea:hover { border-color: var(--gold); }

  :focus { outline: none; }
  :focus-visible { outline: 3px solid var(--gold-ink); outline-offset: 2px; }
  input[type="text"]:focus-visible, textarea:focus-visible {
    outline: none;
    border-color: var(--gold-ink);
    box-shadow: 0 0 0 3px rgba(150, 97, 32, .28);
  }

  /* options */
  .options { display: grid; gap: 10px; }
  .option { position: relative; display: block; cursor: pointer; }
  .option input {
    position: absolute; opacity: 0; width: 1px; height: 1px; margin: 0;
  }
  .option .tile {
    display: grid;
    grid-template-columns: 24px 1fr;
    column-gap: 14px;
    align-items: start;
    min-height: 68px;
    padding: 13px 16px 13px 14px;
    border: 1px solid var(--vein);
    border-radius: 14px;
    background: transparent;
    transition: background-color .18s var(--ease), border-color .18s var(--ease);
  }
  .option:hover .tile { border-color: #CDBDA8; }
  .option .dot {
    width: 22px; height: 22px; margin-top: 3px;
    border: 1.5px solid var(--gold-ink);
    border-radius: 50%;
    display: grid; place-items: center;
    background: var(--alabaster);
  }
  .option .dot::after {
    content: ""; width: 10px; height: 10px; border-radius: 50%;
    background: var(--gold); transform: scale(0);
    transition: transform .18s var(--ease);
  }
  .option .title { display: block; font-weight: 500; font-size: 19px; line-height: 1.3; }
  .option .sub { display: block; margin-top: 2px; font-size: 16px; line-height: 1.38; color: var(--ink-2); }
  .option input:checked + .tile { background: var(--gold-wash); border-color: var(--gold); }
  .option input:checked + .tile .dot::after { transform: scale(1); }
  .option input:focus-visible + .tile { outline: 3px solid var(--gold-ink); outline-offset: 2px; }

  /* ---------- link + actions */
  .send { margin-top: 40px; padding-top: 30px; border-top: 1px solid var(--vein); }
  textarea.link {
    min-height: 0;
    resize: none;
    font-size: 16.5px;
    line-height: 1.45;
    color: var(--ink);
    word-break: break-all;
    overflow: hidden;
    background: #F4F1EC;
    border-color: var(--vein);
  }
  textarea.link:hover { border-color: var(--edge); }

  .actions { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 14px; }
  .actions .wide { grid-column: 1 / -1; }
  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 10px;
    min-height: var(--tap);
    padding: 10px 18px;
    border-radius: 999px;
    border: 1px solid var(--ink);
    background: transparent;
    color: var(--ink);
    font-size: 18.5px;
    font-weight: 500;
    line-height: 1.2;
    text-align: center;
    text-decoration: none;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
    transition: background-color .15s var(--ease), color .15s var(--ease), border-color .15s var(--ease);
    touch-action: manipulation;
  }
  .btn:hover { background: rgba(47, 33, 25, .06); }
  .btn:active { background: rgba(47, 33, 25, .12); }
  .btn svg { width: 20px; height: 20px; flex: none; }
  .btn.primary { background: var(--gold); border-color: var(--gold); color: #FFFDF9; min-height: 56px; font-size: 19.5px; }
  .btn.primary:hover { background: #875619; border-color: #875619; }
  .btn.primary:active { background: #7A4E1A; }
  .btn.quiet { border-color: transparent; color: var(--gold-ink); text-decoration: underline; text-decoration-thickness: 1px; text-underline-offset: 4px; }
  .btn.quiet:hover { background: rgba(150, 97, 32, .08); }
  .btn[hidden] { display: none; }
  .btn.is-done { border-color: var(--gold); color: var(--gold-ink); background: var(--gold-wash); }

  .message-block { margin-top: 34px; }
  textarea.message { min-height: 200px; resize: none; overflow: hidden; font-size: 18px; line-height: 1.5; }
  .message-tools { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 6px 12px; margin-top: 6px; }
  .message-tools .note { margin: 0; font-size: 16px; color: var(--ink-2); flex: 1 1 14em; }
  .message-tools .btn.quiet { min-height: 44px; padding: 6px 10px; margin-right: -10px; font-size: 17px; }

  /* ---------- recent */
  .recent { margin-top: 48px; padding-top: 30px; border-top: 1px solid var(--vein); }
  .recent-head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
  .recent h2 { margin: 0; font-family: var(--display); font-optical-sizing: auto; font-weight: 500; font-size: 25px; line-height: 1.2; }
  .recent-head .btn.quiet { min-height: 44px; padding: 6px 10px; margin-right: -10px; font-size: 17px; }
  .recent .empty { margin: 10px 0 0; color: var(--ink-2); font-size: 17px; }
  .recent ol { list-style: none; margin: 12px 0 0; padding: 0; }
  .recent li {
    display: grid;
    grid-template-columns: 1fr auto;
    gap: 4px 12px;
    align-items: center;
    padding: 14px 0;
    border-bottom: 1px solid var(--vein);
  }
  .recent li:last-child { border-bottom: 0; }
  .recent .who { font-size: 19px; font-weight: 500; line-height: 1.3; overflow-wrap: anywhere; }
  .recent .who.unnamed { font-style: italic; font-weight: 400; color: var(--ink-2); }
  .recent .meta { display: block; margin-top: 2px; font-size: 15.5px; line-height: 1.35; color: var(--ink-2); }
  .recent .row-actions { display: flex; gap: 8px; }
  .recent .row-actions .btn { min-height: 44px; min-width: 64px; padding: 6px 14px; font-size: 16.5px; border-color: var(--edge); }

  .foot { margin: 40px 0 0; text-align: center; font-size: 15.5px; color: var(--ink-2); }

  /* ---------- toast */
  .toast {
    position: fixed; left: 50%; bottom: calc(20px + env(safe-area-inset-bottom, 0px));
    transform: translate(-50%, 12px);
    max-width: calc(100% - 32px);
    padding: 11px 20px;
    border-radius: 999px;
    background: var(--ink); color: #FAF4EA;
    font-size: 17px; line-height: 1.3;
    opacity: 0; pointer-events: none;
    transition: opacity .2s var(--ease), transform .2s var(--ease);
    z-index: 10;
  }
  .toast.show { opacity: 1; transform: translate(-50%, 0); }

  .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }

  @media (min-width: 400px) {
    :root { --gutter: 20px; }
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { transition-duration: 0s !important; animation-duration: 0s !important; scroll-behavior: auto !important; }
  }
</style>
</head>

  let k = (/(?:^#|&)k=([A-Za-z0-9_-]{22})(?:&|$)/.exec(location.hash) || [])[1] || '';
  try { if (k) localStorage.setItem(STORE, k); else k = localStorage.getItem(STORE) || ''; } catch (e) {}
  const fail = () => { note.hidden = false; };
  if (!k || !window.crypto || !crypto.subtle) { fail(); return; }
  const bytes = (s) => { s = s.replace(/-/g, '+').replace(/_/g, '/'); s += '='.repeat((4 - (s.length % 4)) % 4); return Uint8Array.from(atob(s), (ch) => ch.charCodeAt(0)); };
  const raw = bytes(document.getElementById('sealed').textContent.trim());
  crypto.subtle.importKey('raw', bytes(k), 'AES-GCM', false, ['decrypt'])
    .then((key) => crypto.subtle.decrypt({ name: 'AES-GCM', iv: raw.slice(0, 12) }, key, raw.slice(12)))
    .then((buf) => {
      const d = JSON.parse(new TextDecoder().decode(buf));
      document.title = d.title;
      note.remove();
      document.body.insertAdjacentHTML('afterbegin', d.markup);
      for (const code of d.scripts) { const s = document.createElement('script'); s.textContent = code; document.body.appendChild(s); }
    })
    .catch(() => { try { localStorage.removeItem(STORE); } catch (e) {} fail(); });
})();</script>
